[project]
name = "code-along"
version = "0.0.0"
description = "Collaborative Python learning and development platform"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.uv]
package = false
required-version = "==0.10.9"
no-build = true

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".design-references", ".pnpm-store", ".uv-cache"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
norecursedirs = [".*", "node_modules", "venv", "dist", "build"]
