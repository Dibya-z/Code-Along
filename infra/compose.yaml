name: code-along-dev
x-api: &api
  build:
    context: ..
    dockerfile: infra/docker/api.Dockerfile
  environment: &api-env
    DJANGO_SETTINGS_MODULE: config.settings.development
    CODE_ALONG_DEBUG: 'false'
    CODE_ALONG_SECRET_KEY: ${CODE_ALONG_SECRET_KEY:?Generate .env with tools/dev/init_development.py}
    CODE_ALONG_ALLOWED_HOSTS: 127.0.0.1,localhost,api
    CODE_ALONG_DB_NAME: code_along
    CODE_ALONG_DB_USER: code_along
    CODE_ALONG_DB_PASSWORD: ${CODE_ALONG_DB_PASSWORD:?Generate .env first}
    CODE_ALONG_DB_HOST: db
    CODE_ALONG_REDIS_URL: redis://redis:6379/0
    CODE_ALONG_TRUST_PROXY: 'true'
    CODE_ALONG_APP_ORIGIN: https://127.0.0.1:${CODE_ALONG_HTTPS_PORT:-8443}
    CODE_ALONG_MAIL_DIR: /app/dev-mail
    CODE_ALONG_COLLABORATION_SECRET: ${CODE_ALONG_COLLABORATION_SECRET:?Run npm run dev to prepare local secrets}
    CODE_ALONG_COLLABORATION_CONTROL_SECRET: ${CODE_ALONG_COLLABORATION_CONTROL_SECRET:?Run npm run dev first}
    CODE_ALONG_COLLABORATION_CONTROL_URL: http://collaboration:1234
  volumes: [mail:/app/dev-mail]
  networks: [backend]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
services:
  db:
    image: postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    environment:
      POSTGRES_DB: code_along
      POSTGRES_USER: code_along
      POSTGRES_PASSWORD: ${CODE_ALONG_DB_PASSWORD:?Generate .env first}
    volumes: [database:/var/lib/postgresql]
    networks: [backend]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.4.5-alpine@sha256:bd4a0d37e7cd830117ffec9329052b4a1887afa060c265e1768f82b177ff6f43
    command: [redis-server, --save, '', --appendonly, 'no']
    networks: [backend]
    healthcheck:
      { test: [CMD, redis-cli, ping], interval: 3s, timeout: 3s, retries: 20 }
  migrate:
    <<: *api
    command: [/app/.venv/bin/python, manage.py, migrate, --noinput]
  api:
    <<: *api
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          /app/.venv/bin/python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  collaboration-role:
    <<: *api
    command: [/app/.venv/bin/python, manage.py, provision_collaboration_role]
    environment:
      <<: *api-env
      CODE_ALONG_COLLABORATION_DB_USER: code_along_collaboration
      CODE_ALONG_COLLABORATION_DB_PASSWORD: ${CODE_ALONG_COLLABORATION_DB_PASSWORD:?Run npm run dev first}
    depends_on:
      migrate: { condition: service_completed_successfully }
  collaboration:
    build:
      context: ..
      dockerfile: infra/docker/collaboration.Dockerfile
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      CODE_ALONG_APP_ORIGIN: https://127.0.0.1:${CODE_ALONG_HTTPS_PORT:-8443}
      CODE_ALONG_COLLABORATION_HOST: 0.0.0.0
      CODE_ALONG_COLLABORATION_PORT: '1234'
      CODE_ALONG_COLLABORATION_API_URL: http://api:8000
      CODE_ALONG_SESSION_COOKIE_NAME: codealong_session
      CODE_ALONG_COLLABORATION_SECRET: ${CODE_ALONG_COLLABORATION_SECRET:?Run npm run dev first}
      CODE_ALONG_COLLABORATION_CONTROL_SECRET: ${CODE_ALONG_COLLABORATION_CONTROL_SECRET:?Run npm run dev first}
      PGHOST: db
      PGPORT: '5432'
      PGDATABASE: code_along
      PGUSER: code_along_collaboration
      PGPASSWORD: ${CODE_ALONG_COLLABORATION_DB_PASSWORD:?Run npm run dev first}
      PGSSLMODE: disable
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [backend]
    depends_on:
      api: { condition: service_healthy }
      collaboration-role: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:1234/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  proxy:
    build:
      context: ..
      dockerfile: infra/docker/assets.Dockerfile
    environment:
      APP_ORIGIN: https://127.0.0.1:${CODE_ALONG_HTTPS_PORT:-8443}
      RUNNER_ORIGIN: https://localhost:${CODE_ALONG_HTTPS_PORT:-8443}
    ports: ['127.0.0.1:${CODE_ALONG_HTTPS_PORT:-8443}:8443']
    volumes: ['../.runtime/certs:/certs:ro']
    networks: [backend]
    depends_on:
      api: { condition: service_healthy }
      collaboration: { condition: service_healthy }
networks:
  backend:
volumes:
  database:
  mail:
