name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  COREPACK_HOME: ${{ github.workspace }}/.pnpm-store/corepack
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  STORYBOOK_DISABLE_TELEMETRY: '1'
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13.12
      - name: Classify the complete event diff
        id: changes
        run: python tools/ci/check_changes.py
      - name: Test conservative CI classification and documentation checks
        run: python -m unittest discover -s tests/python -p test_ci_changes.py -v
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.changes.outputs.mode != 'docs'
        with:
          version: 0.10.9
          enable-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changes.outputs.mode != 'docs'
        with:
          path: |
            .pnpm-store
            .uv-cache
          key: ${{ runner.os }}-${{ runner.arch }}-deps-${{ hashFiles('pnpm-lock.yaml', 'uv.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-deps-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changes.outputs.mode == 'docs'
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-${{ runner.arch }}-docs-deps-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-docs-deps-
      - name: Check prose with only locked root tooling
        if: steps.changes.outputs.mode == 'docs'
        run: |
          npm install --global corepack@0.36.0
          corepack pnpm --filter code-along --fail-if-no-match install --frozen-lockfile
          python tools/ci/check_changes.py --check-docs
      - name: Install locked tooling
        if: steps.changes.outputs.mode != 'docs'
        run: |
          npm install --global corepack@0.36.0
          corepack pnpm install --frozen-lockfile
          uv sync --locked --no-python-downloads
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changes.outputs.mode != 'docs'
        with:
          path: .runtime/ci-services
          key: ${{ runner.os }}-${{ runner.arch }}-pg18.7-redis8.4.5-v1
      - name: Build owned native service tools
        if: steps.changes.outputs.mode != 'docs'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential bison flex
          tools/ci/setup_native_services.sh
      - name: Show owned native build failures
        if: failure() && steps.changes.outputs.mode != 'docs'
        run: |
          for ca_log in .runtime/ci-services/*-build.log; do
            [ ! -f "$ca_log" ] || tail -n 50 "$ca_log"
          done
      - name: Quality, locks and generated contract drift
        if: steps.changes.outputs.mode != 'docs'
        run: |
          corepack pnpm check
          corepack pnpm api:check
          uv lock --check --offline
          uv run --locked --offline ruff check .
          uv run --locked --offline ruff format --check .
          uv run --locked --offline mypy
      - name: Published dependency advisories
        if: steps.changes.outputs.mode != 'docs'
        run: |
          corepack pnpm audit --audit-level moderate
          uv run --locked --offline python tools/ci/check_python_advisories.py
      - name: Backend, protocol and durable transport tests
        if: steps.changes.outputs.mode != 'docs'
        run: |
          uv run --locked --offline python -m pytest -q
          corepack pnpm test
          uv run --locked --offline python tools/dev/postgres_cluster.py -- corepack pnpm --filter @code-along/collaboration test:integration
          uv run --locked --offline python tools/dev/postgres_cluster.py -- corepack pnpm --filter @code-along/collaboration test:transport
          uv run --locked --offline python tools/dev/postgres_cluster.py -- corepack pnpm --filter @code-along/collaboration test:product
      - name: Build frontend, runner and component stories
        if: steps.changes.outputs.mode != 'docs'
        run: |
          corepack pnpm --filter @code-along/web build
          corepack pnpm --filter @code-along/runner-web build
          corepack pnpm --filter @code-along/browser-proofs build
          corepack pnpm --filter @code-along/design-system build-storybook
      - name: Browser isolation, UI and two-user foundation flows
        if: steps.changes.outputs.mode != 'docs'
        run: |
          corepack pnpm --filter @code-along/browser-proofs exec playwright install --with-deps chromium webkit
          corepack pnpm --filter @code-along/browser-proofs test:browser
          corepack pnpm --filter @code-along/browser-proofs test:foundation
          uv run --locked --offline python tools/dev/init_development.py
          corepack pnpm --filter @code-along/browser-proofs test:product
      - name: Keep failed owned browser evidence
        if: failure() && steps.changes.outputs.mode != 'docs'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owned-browser-failures
          path: tests/browser/test-results
          retention-days: 3
          if-no-files-found: ignore
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13.12
      - name: Classify the complete event diff
        id: changes
        run: python tools/ci/check_changes.py
      - name: Record prose-only Compose decision
        if: steps.changes.outputs.mode == 'docs'
        run: echo "Prose-only diff; foundation checks pinned formatting and local file links."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.mode != 'docs'
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Build and start only the owned CI stack
        if: steps.changes.outputs.mode != 'docs'
        run: |
          python tools/dev/init_development.py
          docker compose -p code-along-ci --env-file .env -f infra/compose.yaml config --quiet
          docker compose -p code-along-ci --env-file .env -f infra/compose.yaml up --build -d
          python tools/ci/compose_smoke.py
      - name: Verify connected frontend development and live updates
        if: steps.changes.outputs.mode != 'docs'
        run: |
          docker compose -p code-along-ci --env-file .env -f infra/compose.yaml -f infra/compose.development.yaml -f infra/compose.development-test.yaml up --build -d
          npm install --global corepack@0.36.0
          corepack pnpm install --frozen-lockfile
          corepack pnpm --filter @code-along/browser-proofs exec playwright install --with-deps chromium webkit
          CODE_ALONG_DEVELOPMENT_PROOF=true corepack pnpm --filter @code-along/browser-proofs test:development
      - name: Show bounded service failures
        if: failure() && steps.changes.outputs.mode != 'docs'
        run: docker compose -p code-along-ci --env-file .env -f infra/compose.yaml -f infra/compose.development.yaml -f infra/compose.development-test.yaml logs --no-color --tail 80
      - name: Remove only disposable CI services and volumes
        if: always() && steps.changes.outputs.mode != 'docs'
        run: docker compose -p code-along-ci --env-file .env -f infra/compose.yaml -f infra/compose.development.yaml -f infra/compose.development-test.yaml down --volumes --remove-orphans
